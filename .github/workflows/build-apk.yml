name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk tareas-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tareas-debug-apk
          path: tareas-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" tareas-debug.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "APK de prueba #${{ github.run_number }}" \
            --notes "Build debug de la rama ${{ github.ref_name }} (${{ github.sha }})"
